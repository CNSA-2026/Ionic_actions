<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Sign In</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
  <ion-grid class="login-page">
    <ion-row class="ion-justify-content-center login-row">
      <ion-col size="12" size-md="8" size-lg="5">
        <ion-card class="login-card">
          <ion-card-header>
            <ion-title size="large" class="login-title">Welcome back</ion-title>
          </ion-card-header>

          <ion-card-content>
            <ion-list lines="full" class="list-separated">
              <ion-item>
                <ion-icon slot="start" name="mail-outline"></ion-icon>
                <ion-label position="stacked">Email</ion-label>
                <ion-input
                  type="email"
                  placeholder="Enter your email"
                ></ion-input>
              </ion-item>

              <ion-item>
                <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
                <ion-label position="stacked">Password</ion-label>
                <ion-input
                  type="password"
                  placeholder="Enter your password"
                ></ion-input>
              </ion-item>
            </ion-list>

            <ion-button expand="block" color="primary" (click)="login()">
              <ion-icon slot="start" name="log-in-outline"></ion-icon>
              Log In
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
